<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pages</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="title">My Pages</h1>
<p class="intro" id="intro">Loading the menu...</p>

<div class="menu" id="menu"></div>

<script>
// The menu is built from manifest.json. To add a page, add an entry there:
//   { "title": "...", "description": "...", "html": "pages/name.html", "css": "pages/name.css" }

function el(id) { return document.getElementById(id); }

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function loadManifest() {
  var req = new XMLHttpRequest();
  // Synchronous on purpose: no async code, so it works on simple browsers like the Kindle's.
  req.open('GET', 'manifest.json?t=' + new Date().getTime(), false);
  try { req.send(null); } catch (e) { return null; }
  if ((req.status !== 200 && req.status !== 0) || !req.responseText) return null;
  try { return JSON.parse(req.responseText); } catch (e2) { return 'bad'; }
}

function buildMenu() {
  var m = loadManifest();
  if (m === null) {
    el('intro').innerHTML = 'Could not load manifest.json. It must be in the same folder as index.html, and the site must be opened from a web server (like GitHub Pages), not straight from your computer.';
    return;
  }
  if (m === 'bad' || !m.pages) {
    el('intro').innerHTML = 'manifest.json has a mistake in it. Check for a missing comma, quote or bracket.';
    return;
  }
  if (m.title) { el('title').innerHTML = esc(m.title); document.title = m.title; }
  el('intro').innerHTML = esc(m.intro || '');

  var h = '', i, p;
  for (i = 0; i < m.pages.length; i++) {
    p = m.pages[i];
    if (!p || !p.html) continue;
    h += '<a class="item" href="' + esc(p.html) + '">' +
         '<span class="title">' + esc(p.title || p.html) + '</span>' +
         (p.description ? '<span class="desc">' + esc(p.description) + '</span>' : '') +
         '</a>';
  }
  el('menu').innerHTML = h || '<p class="intro">No pages in manifest.json yet.</p>';
}

buildMenu();
</script>
</body>
</html>
