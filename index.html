<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper</title>
<style>
body { margin: 0; padding: 10px; background: #fff; color: #000; font-family: Georgia, serif; }
h1 { font-size: 26px; margin: 0 0 4px 0; }
p { margin: 0 0 10px 0; font-size: 16px; line-height: 1.4; }
button { font-family: Georgia, serif; font-size: 18px; padding: 8px 12px; margin: 0 4px 6px 0; background: #fff; color: #000; border: 2px solid #000; border-radius: 0; }
button.on { background: #000; color: #fff; }
#info { font-size: 18px; font-weight: bold; margin: 4px 0 8px 0; }
#msg { font-size: 17px; font-weight: bold; min-height: 24px; margin: 10px 0; }
table { border-collapse: collapse; margin: 0 auto; }
td { border: 1px solid #000; padding: 0; text-align: center; vertical-align: middle; font-weight: bold; font-family: Arial, Helvetica, sans-serif; }
td.c { background: #bbb; }
td.o { background: #fff; }
td.f { background: #000; color: #fff; }
td.m { background: #fff; }
td.x { background: #000; color: #fff; }
td.w { background: #fff; text-decoration: line-through; }
td.hs { border: 4px dashed #000; }
td.hm { border: 4px double #000; }
</style>
</head>
<body>
<h1>Minesweeper</h1>
<p>Every board can be cleared with logic alone. No guessing needed.</p>
<div>
  <button id="b-easy" onclick="setLevel('easy')">Easy</button>
  <button id="b-medium" onclick="setLevel('medium')">Medium</button>
  <button id="b-hard" onclick="setLevel('hard')">Hard</button>
</div>
<div>
  <button id="mode" onclick="toggleMode()">Tap to: Open</button>
  <button onclick="hint()">Hint</button>
  <button onclick="newGame()">New game</button>
</div>
<div id="info"></div>
<div id="board"></div>
<div id="msg"></div>
<p>Use the "Tap to" button to switch between opening squares and placing flags (F). Tap a number whose mines are all flagged to open the squares around it.</p>
<p id="best"></p>
<script>
function zeros(n){ var a = new Array(n); for (var i = 0; i < n; i++) a[i] = 0; return a; }

function neighbors(W, H){
  var nb = [], x, y, dx, dy, a, nx, ny;
  for (y = 0; y < H; y++) for (x = 0; x < W; x++){
    a = [];
    for (dy = -1; dy <= 1; dy++) for (dx = -1; dx <= 1; dx++){
      if (!dx && !dy) continue;
      nx = x + dx; ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < W && ny < H) a.push(ny * W + nx);
    }
    nb[y * W + x] = a;
  }
  return nb;
}

function counts(mine, nb, N){
  var num = zeros(N), i, j, c;
  for (i = 0; i < N; i++) if (!mine[i]){
    c = 0; for (j = 0; j < nb[i].length; j++) c += mine[nb[i][j]];
    num[i] = c;
  }
  return num;
}

// Returns an array: 1 = certainly safe, 2 = certainly mine, 0 = unknown. Or null if nothing is certain.
function deduce(N, nb, num, rev, flg, M, limit){
  var mark = zeros(N), found = 0, i, j, k, n, c;
  function add(c, v){ if (!mark[c]){ mark[c] = v; found++; } }
  var revN = 0, flgN = 0;
  for (i = 0; i < N; i++){ if (rev[i]) revN++; else if (flg[i]) flgN++; }

  var cons = [], cellCons = [];
  for (i = 0; i < N; i++) cellCons[i] = null;
  for (i = 0; i < N; i++){
    if (!rev[i] || !num[i]) continue;
    var f = 0, u = [];
    for (j = 0; j < nb[i].length; j++){ n = nb[i][j]; if (flg[n]) f++; else if (!rev[n]) u.push(n); }
    if (!u.length) continue;
    var need = num[i] - f;
    if (need === 0) for (j = 0; j < u.length; j++) add(u[j], 1);
    else if (need === u.length) for (j = 0; j < u.length; j++) add(u[j], 2);
    k = cons.length; cons.push({ cells: u, need: need });
    for (j = 0; j < u.length; j++){ if (!cellCons[u[j]]) cellCons[u[j]] = []; cellCons[u[j]].push(k); }
  }
  if (found) return mark;

  // Pairwise reasoning between overlapping numbers
  var stampA = zeros(N), stampB = zeros(N), done = zeros(cons.length);
  for (var a = 0; a < cons.length; a++){
    var A = cons[a];
    for (j = 0; j < A.cells.length; j++) stampA[A.cells[j]] = a + 1;
    for (j = 0; j < A.cells.length; j++){
      var lst = cellCons[A.cells[j]];
      for (var q = 0; q < lst.length; q++){
        var b = lst[q];
        if (b <= a || done[b] === a + 1) continue;
        done[b] = a + 1;
        var B = cons[b], inter = 0;
        for (k = 0; k < B.cells.length; k++){ stampB[B.cells[k]] = b + 1; if (stampA[B.cells[k]] === a + 1) inter++; }
        var oA = A.cells.length - inter, oB = B.cells.length - inter;
        var maxI = Math.min(inter, A.need, B.need);
        var minI = Math.max(0, A.need - oA, B.need - oB);
        var lo, hi;
        if (oA){
          lo = A.need - maxI; hi = A.need - minI;
          if (hi === 0 || lo === oA) for (k = 0; k < A.cells.length; k++) if (stampB[A.cells[k]] !== b + 1) add(A.cells[k], hi === 0 ? 1 : 2);
        }
        if (oB){
          lo = B.need - maxI; hi = B.need - minI;
          if (hi === 0 || lo === oB) for (k = 0; k < B.cells.length; k++) if (stampA[B.cells[k]] !== a + 1) add(B.cells[k], hi === 0 ? 1 : 2);
        }
        for (k = 0; k < B.cells.length; k++) stampB[B.cells[k]] = 0;
      }
    }
  }
  if (found) return mark;

  var rem = M - flgN, unk = N - revN - flgN;
  if (unk > 0 && (rem === 0 || rem === unk)){
    for (i = 0; i < N; i++) if (!rev[i] && !flg[i]) add(i, rem === 0 ? 1 : 2);
    return mark;
  }

  // Exhaustive check of each connected frontier group
  var seen = zeros(N), cstamp = zeros(cons.length), comps = [], frontier = 0;
  for (var s = 0; s < N; s++){
    if (!cellCons[s] || seen[s]) continue;
    var cells = [s], ccl = [];
    seen[s] = 1;
    for (var h = 0; h < cells.length; h++){
      var cl = cellCons[cells[h]];
      for (j = 0; j < cl.length; j++){
        k = cl[j]; if (cstamp[k]) continue; cstamp[k] = 1; ccl.push(k);
        for (var t = 0; t < cons[k].cells.length; t++){ c = cons[k].cells[t]; if (!seen[c]){ seen[c] = 1; cells.push(c); } }
      }
    }
    var comp = { cells: cells, cons: ccl };
    enumerate(comp, cons, N, limit);
    frontier += cells.length;
    comps.push(comp);
  }
  var nonF = unk - frontier, sumMin = 0, sumMax = 0;
  for (i = 0; i < comps.length; i++){ sumMin += comps[i].minK; sumMax += comps[i].maxK; }
  for (i = 0; i < comps.length; i++){
    var C = comps[i]; if (!C.ok) continue;
    var klo = Math.max(C.minK, rem - (sumMax - C.maxK) - nonF);
    var khi = Math.min(C.maxK, rem - (sumMin - C.minK));
    var tot = 0, cnt = zeros(C.cells.length);
    for (k = klo; k <= khi; k++){
      if (!C.sols[k]) continue;
      tot += C.sols[k];
      for (j = 0; j < cnt.length; j++) cnt[j] += C.mk[k][j];
    }
    if (!tot) continue;
    for (j = 0; j < cnt.length; j++){
      if (cnt[j] === 0) add(C.cells[j], 1);
      else if (cnt[j] === tot) add(C.cells[j], 2);
    }
  }
  if (nonF > 0){
    var allSafe = rem - sumMin <= 0, allMine = rem - sumMax >= nonF;
    if (allSafe || allMine) for (i = 0; i < N; i++)
      if (!rev[i] && !flg[i] && !cellCons[i]) add(i, allSafe ? 1 : 2);
  }
  return found ? mark : null;
}

function enumerate(comp, cons, N, limit){
  var L = comp.cells.length, j, q;
  comp.ok = false; comp.minK = 0; comp.maxK = L;
  if (L > 64) return;
  var loc = {};
  for (j = 0; j < L; j++) loc[comp.cells[j]] = j;
  var cc = [], byCell = [];
  for (j = 0; j < L; j++) byCell[j] = [];
  for (q = 0; q < comp.cons.length; q++){
    var K = cons[comp.cons[q]];
    cc.push({ need: K.need, m: 0, u: K.cells.length });
    for (j = 0; j < K.cells.length; j++) byCell[loc[K.cells[j]]].push(q);
  }
  var assign = zeros(L), sols = zeros(L + 1), mk = [], nodes = 0, abort = false;
  function rec(p, k){
    if (abort) return;
    if (++nodes > limit){ abort = true; return; }
    if (p === L){
      sols[k]++;
      if (!mk[k]) mk[k] = zeros(L);
      for (var z = 0; z < L; z++) if (assign[z]) mk[k][z]++;
      return;
    }
    var lst = byCell[p], v, ok, r, X;
    for (v = 0; v < 2; v++){
      ok = true;
      for (r = 0; r < lst.length; r++){ X = cc[lst[r]]; X.u--; X.m += v; if (X.m > X.need || X.m + X.u < X.need) ok = false; }
      if (ok){ assign[p] = v; rec(p + 1, k + v); }
      for (r = 0; r < lst.length; r++){ X = cc[lst[r]]; X.u++; X.m -= v; }
      if (abort) return;
    }
  }
  rec(0, 0);
  if (abort) return;
  var lo = -1, hi = -1;
  for (j = 0; j <= L; j++) if (sols[j] > 0){ if (lo < 0) lo = j; hi = j; }
  if (lo < 0) return;
  comp.ok = true; comp.minK = lo; comp.maxK = hi; comp.sols = sols; comp.mk = mk;
}

function solve(W, H, M, mine, s, nb, limit){
  var N = W * H, num = counts(mine, nb, N), rev = zeros(N), flg = zeros(N), revN = 0, target = N - M;
  function open(i){
    var st = [i], c, j;
    while (st.length){
      c = st.pop();
      if (rev[c] || flg[c]) continue;
      if (mine[c]) throw new Error('solver opened a mine');
      rev[c] = 1; revN++;
      if (num[c] === 0) for (j = 0; j < nb[c].length; j++) if (!rev[nb[c][j]]) st.push(nb[c][j]);
    }
  }
  open(s);
  while (revN < target){
    var d = deduce(N, nb, num, rev, flg, M, limit);
    if (!d) return false;
    for (var i = 0; i < N; i++){ if (d[i] === 2) flg[i] = 1; }
    for (i = 0; i < N; i++){ if (d[i] === 1) open(i); }
  }
  return true;
}

function randomBoard(W, H, M, s){
  var N = W * H, sx = s % W, sy = Math.floor(s / W), p = [], i, x, y, k, j, t;
  for (i = 0; i < N; i++){
    x = i % W; y = Math.floor(i / W);
    if (Math.abs(x - sx) <= 1 && Math.abs(y - sy) <= 1) continue;
    p.push(i);
  }
  var mine = zeros(N);
  for (k = 0; k < M; k++){
    j = k + Math.floor(Math.random() * (p.length - k));
    t = p[k]; p[k] = p[j]; p[j] = t;
    mine[p[k]] = 1;
  }
  return mine;
}
var LEVELS = { easy: [9, 9, 10], medium: [16, 16, 40], hard: [30, 16, 99] };
var NAMES = { easy: 'Easy', medium: 'Medium', hard: 'Hard' };
var level = 'easy', flagMode = false, G = null, tds = [], hinted = -1;

function sget(k){ try { return window.localStorage ? localStorage.getItem(k) : null; } catch (e) { return null; } }
function sset(k, v){ try { if (window.localStorage) localStorage.setItem(k, v); } catch (e) {} }
function el(id){ return document.getElementById(id); }
function msg(t){ el('msg').innerHTML = t; }
function screenW(){ return window.innerWidth || document.documentElement.clientWidth || 600; }

function dims(){
  var L = LEVELS[level];
  if (level === 'hard' && screenW() < 900) return [L[1], L[0], L[2]];
  return L;
}

function setLevel(l){ level = l; sset('ms-level', l); newGame(); }

function toggleMode(){
  flagMode = !flagMode;
  var b = el('mode');
  b.innerHTML = flagMode ? 'Tap to: Flag' : 'Tap to: Open';
  b.className = flagMode ? 'on' : '';
}

function newGame(){
  var d = dims();
  G = { W: d[0], H: d[1], M: d[2], N: d[0] * d[1], status: 'ready', revN: 0, flgN: 0, hints: 0, start: 0, level: level };
  G.nb = neighbors(G.W, G.H); G.rev = zeros(G.N); G.flg = zeros(G.N);
  hinted = -1;
  el('b-easy').className = level === 'easy' ? 'on' : '';
  el('b-medium').className = level === 'medium' ? 'on' : '';
  el('b-hard').className = level === 'hard' ? 'on' : '';
  build(); info(); showBest();
  msg('Tap any square to begin. Your first tap always opens a clear area.');
}

function build(){
  var s = Math.floor((screenW() - 24) / G.W) - 1;
  if (s > 48) s = 48; if (s < 22) s = 22;
  var fs = Math.floor(s * 0.6), h = ['<table>'], x, y, i;
  for (y = 0; y < G.H; y++){
    h.push('<tr>');
    for (x = 0; x < G.W; x++){
      i = y * G.W + x;
      h.push('<td class="c" id="c' + i + '" style="width:' + s + 'px;height:' + s + 'px;font-size:' + fs + 'px"></td>');
    }
    h.push('</tr>');
  }
  h.push('</table>');
  el('board').innerHTML = h.join('');
  tds = [];
  for (i = 0; i < G.N; i++) tds[i] = el('c' + i);
}

function info(){ el('info').innerHTML = 'Mines left: ' + (G.M - G.flgN); }

function paint(i){
  var t = tds[i];
  if (G.rev[i]){ t.className = 'o'; t.innerHTML = G.num[i] ? G.num[i] : ''; }
  else if (G.flg[i]){ t.className = 'f'; t.innerHTML = 'F'; }
  else { t.className = 'c'; t.innerHTML = ''; }
}

function fmt(s){ var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

el('board').onclick = function (e){
  e = e || window.event;
  var t = e.target || e.srcElement;
  while (t && t.tagName !== 'TD'){ if (t.id === 'board') return; t = t.parentNode; }
  if (!t) return;
  tap(parseInt(t.id.substring(1), 10));
};

function clearHint(){ if (hinted >= 0 && tds[hinted]){ var i = hinted; hinted = -1; paint(i); } }

function tap(i){
  if (G.status !== 'ready' && G.status !== 'playing') return;
  clearHint();
  if (flagMode && !G.rev[i]){
    if (G.status === 'ready'){ msg('Open a square first, then place flags.'); return; }
    G.flg[i] = G.flg[i] ? 0 : 1; G.flgN += G.flg[i] ? 1 : -1;
    paint(i); info(); return;
  }
  if (G.status === 'ready'){
    G.status = 'busy';
    msg('Building your board...');
    var g = G;
    setTimeout(function (){
      if (G !== g) return;
      var m, tries = 0;
      do { tries++; m = randomBoard(g.W, g.H, g.M, i); } while (!solve(g.W, g.H, g.M, m, i, g.nb, 20000) && tries < 5000);
      g.mine = m; g.num = counts(m, g.nb, g.N);
      g.status = 'playing'; g.start = new Date().getTime();
      msg('');
      openAt(i);
    }, 60);
    return;
  }
  openAt(i);
}

function flood(i){
  if (G.rev[i] || G.flg[i]) return true;
  if (G.mine[i]) return false;
  var st = [i], c, j, n;
  while (st.length){
    c = st.pop();
    if (G.rev[c] || G.flg[c]) continue;
    G.rev[c] = 1; G.revN++; paint(c);
    if (G.num[c] === 0) for (j = 0; j < G.nb[c].length; j++){ n = G.nb[c][j]; if (!G.rev[n] && !G.flg[n]) st.push(n); }
  }
  return true;
}

function openAt(i){
  if (G.flg[i]) return;
  var j, n, f = 0;
  if (G.rev[i]){
    if (!G.num[i]) return;
    for (j = 0; j < G.nb[i].length; j++) f += G.flg[G.nb[i][j]];
    if (f !== G.num[i]) return;
    for (j = 0; j < G.nb[i].length; j++){ n = G.nb[i][j]; if (!flood(n)) return lose(n); }
  } else if (!flood(i)) return lose(i);
  if (G.revN === G.N - G.M) win();
}

function lose(hit){
  G.status = 'lost';
  for (var i = 0; i < G.N; i++){
    if (G.mine[i] && !G.flg[i]){ tds[i].className = i === hit ? 'x' : 'm'; tds[i].innerHTML = '*'; }
    else if (G.flg[i] && !G.mine[i]){ tds[i].className = 'w'; tds[i].innerHTML = 'F'; }
  }
  msg('Boom! That was a mine. There was always a sure move. Tap New game to try again.');
}

function win(){
  G.status = 'won';
  var secs = Math.floor((new Date().getTime() - G.start) / 1000);
  for (var i = 0; i < G.N; i++) if (G.mine[i] && !G.flg[i]){ G.flg[i] = 1; G.flgN++; paint(i); }
  info();
  var t = 'You cleared it in ' + fmt(secs) + '!';
  if (G.hints) t += ' (Hints used, so this time does not count as a best.)';
  else {
    var old = parseInt(sget('ms-best-' + G.level), 10);
    if (isNaN(old) || secs < old){ sset('ms-best-' + G.level, String(secs)); t += ' New best time!'; }
  }
  msg(t); showBest();
}

function showBest(){
  var parts = [], k, v;
  for (k in NAMES){ v = parseInt(sget('ms-best-' + k), 10); parts.push(NAMES[k] + ': ' + (isNaN(v) ? 'none yet' : fmt(v))); }
  el('best').innerHTML = 'Best times. ' + parts.join(', ');
}

function hint(){
  if (G.status !== 'playing'){ msg(G.status === 'ready' ? 'Open a square first.' : ''); return; }
  clearHint();
  var known = zeros(G.N), it, d, i, pick;
  for (it = 0; it < 200; it++){
    d = deduce(G.N, G.nb, G.num, G.rev, known, G.M, 300000);
    if (!d) break;
    pick = -1;
    for (i = 0; i < G.N; i++) if (d[i] === 1 && G.flg[i]){ pick = i; break; }
    if (pick < 0) for (i = 0; i < G.N; i++) if (d[i] === 1){ pick = i; break; }
    if (pick >= 0){
      G.hints++; hinted = pick; tds[pick].className += ' hs';
      msg(G.flg[pick] ? 'The dashed square has a flag but is safe. Remove the flag and open it.' : 'The dashed square is safe to open.');
      return;
    }
    for (i = 0; i < G.N; i++) if (d[i] === 2 && !G.flg[i]){ pick = i; break; }
    if (pick >= 0){
      G.hints++; hinted = pick; tds[pick].className += ' hm';
      msg('The square with the thick border is a mine. Flag it.');
      return;
    }
    for (i = 0; i < G.N; i++) if (d[i] === 2) known[i] = 1;
  }
  msg('No certain move found from here.');
}

var saved = sget('ms-level');
if (saved && LEVELS[saved]) level = saved;
newGame();
</script>
</body>
</html>
